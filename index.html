<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>土豆片 · 网页版发送</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e8ebf2;--sub:#9aa3b2;--accent:#5b8cff;--ok:#3ecf8e;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:40px 20px 10px;max-width:1100px;margin:0 auto}
  h1{margin:0 0 6px;font-size:26px}
  .sub{color:var(--sub);font-size:14px}
  main{max-width:1100px;margin:0 auto;padding:16px 20px 60px;display:grid;grid-template-columns:1fr 360px;gap:20px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  canvas{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:12px;background:#fff}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  button:disabled{opacity:.45;cursor:not-allowed}
  label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
  input[type=text],textarea{width:100%;background:#10131a;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font:inherit}
  textarea{min-height:80px;resize:vertical}
  #log{font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--sub);white-space:pre-wrap;max-height:260px;overflow:auto;background:#0c0f14;border:1px solid var(--line);border-radius:10px;padding:10px}
  .hint{color:var(--sub);font-size:12.5px;margin-top:8px}
  .bar{height:6px;background:#10131a;border-radius:6px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<header>
  <h1>土豆片 · 网页版发送</h1>
  <p class="sub">浏览器本地完成：渲染 → 六色抖动 → QuickLZ 压缩 → Web Bluetooth 直传。不上传任何图片。需要 Chrome / Edge（含安卓版）。</p>
</header>

<main>
  <section class="panel">
    <canvas id="cv" width="528" height="792"></canvas>
    <div class="row">
      <input id="file" type="file" accept="image/*" style="display:none">
      <button onclick="file.click()">选择照片</button>
      <button class="ghost" onclick="renderText()">渲染文字卡</button>
    </div>
    <label>文字卡内容（两行以内效果最好）</label>
    <textarea id="txt">把今天过好，就是对明天最好的准备。</textarea>
    <div class="hint">照片会自动等比铺满 528×792，并做六色 Floyd–Steinberg 抖动。</div>
  </section>

  <aside class="panel">
    <button id="send" style="width:100%" onclick="send()">连接并发送到卡片</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="preview()">重新生成数据</button>
      <button class="ghost" onclick="clearLog()">清空日志</button>
    </div>
    <label>运行日志</label>
    <div id="log">就绪</div>
    <div class="hint" style="margin-top:12px">
      连不上时：① 靠近卡片 ② 敲一敲/长按卡片按键唤醒 ③ 关掉手机上占用蓝牙的 App 再重开浏览器。
    </div>
  </aside>
</main>

<script type="module">
import { buildPayloads, W, H } from './js/payload.js';
import { sendToCard, bleSupported } from './js/ble.js';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { willReadFrequently: true });
const logEl = document.getElementById('log');
let current = null;

const log = (m) => {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logEl.textContent += `\n[${t}] ${m}`;
  logEl.scrollTop = logEl.scrollHeight;
};
const clearLog = () => { logEl.textContent = '就绪'; };

function fillWhite() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }

function drawText() {
  fillWhite();
  const text = document.getElementById('txt').value.trim() || '把今天过好。';
  ctx.fillStyle = '#ff0000'; ctx.fillRect(34, 44, 14, 14);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('每日一句', 58, 60);
  ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  const maxW = W - 68;
  let line = '', y = 180;
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW) { ctx.fillText(line, 34, y); y += 62; line = ch; }
    else line += ch;
    if (y > H - 120) break;
  }
  if (line) ctx.fillText(line, 34, y);
  ctx.font = '16px "PingFang SC",sans-serif';
  ctx.fillStyle = '#000';
  ctx.fillText('土豆片 · 网页版', 34, H - 40);
}

function drawImage(img) {
  const scale = Math.max(W / img.width, H / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  fillWhite();
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

function build() {
  const data = ctx.getImageData(0, 0, W, H);
  const t0 = performance.now();
  const arts = buildPayloads(data);
  current = arts;
  log(`已生成：payload ${arts.payload.length} B，legacy ${arts.legacy.length} B，耗时 ${(performance.now() - t0).toFixed(0)} ms`);
  return arts;
}

function renderText() { drawText(); build(); }
function preview() { build(); }

document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => { drawImage(img); build(); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
});

async function send() {
  if (!bleSupported()) { log('❌ 这个浏览器不支持 Web Bluetooth，请用 Chrome / Edge'); return; }
  const btn = document.getElementById('send');
  btn.disabled = true;
  try {
    const arts = current || build();
    const res = await sendToCard(arts.payload, log, (p) => {
      document.getElementById('prog').style.width = (p * 100).toFixed(0) + '%';
    });
    log(res.acked ? '✅ 完成（已确认）' : '✅ 数据写完（未收到显影确认）');
  } catch (err) {
    log('❌ ' + (err?.message || err));
  } finally {
    btn.disabled = false;
  }
}

window.send = send; window.preview = preview; window.renderText = renderText; window.clearLog = clearLog;
drawText(); build();
</script>
</body>
</html>
