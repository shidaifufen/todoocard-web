<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>土豆片 · 网页版</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e8ebf2;--sub:#9aa3b2;--accent:#5b8cff;--ok:#3ecf8e;--warn:#ffc857}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{max-width:1240px;margin:0 auto;padding:34px 20px 8px}
  h1{margin:0 0 6px;font-size:24px}
  .sub{color:var(--sub);font-size:13.5px}
  main{max-width:1240px;margin:0 auto;padding:14px 20px 70px;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,400px);gap:18px;align-items:start}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;overflow:hidden}
  .panel h3{margin:0 0 12px;font-size:14px;color:#cbd2de}
  canvas{width:100%;max-width:400px;display:block;margin:0 auto;border-radius:10px;background:#fff}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  button:disabled{opacity:.45}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input,textarea,select{width:100%;background:#10131a;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:64px;max-height:150px;resize:vertical;overflow:auto}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{min-width:0}
  .sched{display:grid;grid-template-columns:92px 1fr auto auto;gap:6px;margin-bottom:6px}
  .photos{display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow:auto}
  .photos img{width:56px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  #log{font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--sub);white-space:pre-wrap;max-height:200px;overflow:auto;background:#0c0f14;border:1px solid var(--line);border-radius:9px;padding:9px}
  .bar{height:5px;background:#10131a;border-radius:5px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .hint{color:var(--sub);font-size:12px}
  .warn{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>土豆片 · 网页版</h1>
  <p class="sub">渲染 → 六色抖动 → QuickLZ → Web Bluetooth 直传，全部在浏览器本地完成。<b id="ver">build 2026-11-11 b</b> · 定时任务需要页面保持打开</p>
</header>

<div style="max-width:1240px;margin:0 auto;padding:0 20px 6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
  <span style="color:var(--sub);font-size:13px">字号</span>
  <input id="scaleSlide" type="range" min="90" max="160" step="5" value="100" style="width:220px;max-width:40vw">
  <span id="scaleText" style="color:var(--sub);font-size:13px;width:44px">100%</span>
  <span style="color:var(--sub);font-size:13px;margin-left:10px">行距</span>
  <input id="lineSlide" type="range" min="90" max="180" step="5" value="100" style="width:220px;max-width:40vw">
  <span id="lineText" style="color:var(--sub);font-size:13px;width:44px">100%</span>
</div>

<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <canvas id="cv" width="528" height="792"></canvas>
    <div class="row" style="margin-top:12px">
      <button id="send" onclick="sendNow()" style="flex:1">连接并发送</button>
      <button class="ghost" onclick="forceScan()" title="按名字找不到时用这个">扫描全部</button>
      <button class="ghost" onclick="rebuild()">重新生成</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div style="margin-top:12px"><span class="hint" id="state">就绪</span></div>
    <div id="log" style="margin-top:8px">就绪</div>
  </section>

  <aside style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <section class="panel">
      <h3>内容</h3>
      <div id="params"></div>
    </section>

    <section class="panel">
      <h3>照片库 <span class="hint" id="photoCount"></span></h3>
      <div class="row">
        <input id="files" type="file" accept="image/*" multiple style="display:none">
        <input id="dir" type="file" accept="image/*" multiple webkitdirectory directory style="display:none">
        <button class="ghost" onclick="files.click()">选择照片</button>
        <button class="ghost" onclick="dir.click()">添加文件夹</button>
        <button class="ghost" onclick="clearPhotos()">清空</button>
      </div>
      <div id="drop" class="photos" style="margin-top:10px;min-height:74px;border:1px dashed var(--line);border-radius:9px;padding:8px">
        把照片或整个文件夹拖到这里
      </div>
      <div class="photos" id="photoList" style="margin-top:8px"></div>
      <div class="hint" style="margin-top:8px">照片存在浏览器本地；轮播时随机取，尽量不重复。</div>
    </section>

    <section class="panel">
      <h3>定时任务 <span class="hint">（需保持页面打开）</span></h3>
      <div id="schedList"></div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" onclick="addSched()">+ 加一条</button>
        <button onclick="startSched()" id="schedBtn">启用定时</button>
      </div>
      <div class="hint" id="schedState" style="margin-top:8px">未启用</div>
    </section>
  </aside>
</main>

<script type="module">
import { buildPayloads } from './js/payload.js?v=20261111a';
import { sendToCard, bleSupported } from './js/ble.js?v=20261111a';
import * as T from './js/templates.js?v=20261111a';

const W = 528, H = 792;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { willReadFrequently: true });
const logEl = document.getElementById('log');
const $ = (id) => document.getElementById(id);

const log = (m) => {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logEl.textContent += `\n[${t}] ${m}`;
  logEl.scrollTop = logEl.scrollHeight;
};

// ── 状态持久化 ──
const DEF = { template: 'quote', quote: '把今天过好，就是对明天最好的准备。',
  todos: ['喝水', '写点东西'], countdowns: [{ name: '元旦', date: '2027-01-01' }],
  city: '北京', lat: 39.9042, lon: 116.4074, weather: null, hourly: null, sched: [], photoMode: 'shuffle',
  poem: { title: '静夜思', dynasty: '唐代', author: '李白', lines: ['床前明月光，疑是地上霜。', '举头望明月，低头思故乡。'] },
  poemNote: '诗写夜半难眠时所见：月光落在床前，清冷似霜；抬头望月，低头思乡。以“举头”“低头”两个动作转折，把思乡之情收在无言之中。',
  custom: { title: '我的卡片', lines: ['今天也要好好生活', '把重要的事写下来'] } };
let st = Object.assign({}, DEF, JSON.parse(localStorage.getItem('todo-web') || '{}'));
const save = () => localStorage.setItem('todo-web', JSON.stringify(st));

// ── 照片库（IndexedDB）──
let photos = [];
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('todo-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadPhotos() {
  const db = await idb();
  photos = await new Promise((res) => {
    const q = db.transaction('p').objectStore('p').getAll();
    q.onsuccess = () => res(q.result || []);
  });
  renderPhotos();
}
async function shrink(file, max = 1400) {
  // 原图动辄几 MB，几十张就撑爆浏览器配额；入库前压到长边 1400、JPEG 0.85
  const dataUrl = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
  if (file.size < 400 * 1024) return dataUrl;
  const img = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = dataUrl; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv2 = document.createElement('canvas');
  cv2.width = Math.round(img.width * s); cv2.height = Math.round(img.height * s);
  cv2.getContext('2d').drawImage(img, 0, 0, cv2.width, cv2.height);
  return cv2.toDataURL('image/jpeg', 0.85);
}

async function addPhotos(fileList) {
  const files = [...fileList].filter((f) => f.type.startsWith('image/'));
  if (!files.length) return;
  const db = await idb();
  for (const f of files) {
    try {
      const data = await shrink(f);
      const id = f.name + f.size + Math.random().toString(36).slice(2, 8);
      db.transaction('p', 'readwrite').objectStore('p').put({ id, data, name: f.name });
      photos.push({ id, data, name: f.name });
    } catch (e) { log(`跳过 ${f.name}：${e.message}`); }
  }
  renderPhotos();
  log(`已添加 ${files.length} 张，共 ${photos.length} 张`);
}
async function clearPhotos() {
  const db = await idb();
  db.transaction('p', 'readwrite').objectStore('p').clear();
  photos = []; renderPhotos(); log('照片库已清空');
}
function renderPhotos() {
  $('photoCount').textContent = photos.length ? `共 ${photos.length} 张` : '空';
  $('photoList').innerHTML = photos.slice(-12).map((p) => `<img src="${p.data}" alt="">`).join('');
}
function pickPhoto() {
  if (!photos.length) return null;
  if (st.photoMode === 'shuffle') {
    const used = JSON.parse(localStorage.getItem('todo-used') || '[]');
    let left = photos.filter((p) => !used.includes(p.id));
    if (!left.length) { left = photos; localStorage.setItem('todo-used', '[]'); }
    const pick = left[Math.floor(Math.random() * left.length)];
    used.push(pick.id); localStorage.setItem('todo-used', JSON.stringify(used.slice(-Math.floor(photos.length * 0.8))));
    return pick;
  }
  return photos[Math.floor(Math.random() * photos.length)];
}

// ── 模板 ──
const TPLS = [['quote', '每日一句'], ['summary', '每日总结'], ['todo', '今日待办'], ['progress', '时间进度'],
  ['calendar', '月历'], ['countdown', '倒计时'], ['weather', '天气'], ['weather2', '色块天气'], ['poem', '每日诗词'],
  ['custom', '自定义'], ['photo', '照片轮播']];
function renderTabs() {
  $('tabs').innerHTML = TPLS.map(([k, n]) => `<button class="tab ${st.template === k ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach((b) => b.onclick = () => { st.template = b.dataset.k; save(); renderTabs(); renderParams(); draw(); });
}
function renderParams() {
  const k = st.template;
  const box = $('params');
  if (k === 'quote') box.innerHTML = `<label>一句话</label><textarea id="p_quote">${st.quote}</textarea>`;
  else if (k === 'todo') box.innerHTML = `<label>待办（每行一条）</label><textarea id="p_todos">${st.todos.join('\n')}</textarea>`;
  else if (k === 'countdown') box.innerHTML = `<label>纪念日（名称,YYYY-MM-DD，每行一条）</label><textarea id="p_cd">${st.countdowns.map(c => c.name + ',' + c.date).join('\n')}</textarea>`;
  else if (k === 'weather' || k === 'summary') box.innerHTML = `<label>城市</label><div class="row"><input id="p_city" value="${st.city}"><button class="ghost" onclick="fetchWeather()">拉取</button></div>
     <div class="hint" style="margin-top:6px">${st.weather ? `${st.weather.temp}° ${st.weather.text}` : '未获取'}</div>`;
  else if (k === 'poem') box.innerHTML = `
     <label>整首优先（不截断，字号自动缩）</label>
     <select id="p_full"><option value="0">关（大字优先）</option><option value="1">开（整首优先）</option></select>
     <label>标题</label><input id="p_title" value="${st.poem.title}">
     <label>朝代 / 作者</label><div class="row"><input id="p_dyn" value="${st.poem.dynasty}"><input id="p_author" value="${st.poem.author}"></div>
     <label>诗句（每行一句）</label><textarea id="p_lines" style="min-height:80px">${st.poem.lines.join('\n')}</textarea>
     <label>赏析</label><textarea id="p_note">${st.poemNote || ''}</textarea>
     <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">用 API 自动生成赏析</summary>
       <label>接口（OpenAI 兼容）</label><input id="p_api" value="${st.aiEndpoint || 'https://api.deepseek.com/v1'}">
       <label>API Key</label><input id="p_key" type="password" value="${st.aiKey || ''}">
       <label>模型</label><input id="p_model" value="${st.aiModel || 'deepseek-chat'}">
       <div class="btnrow"><button class="ghost" onclick="genNote()">生成赏析</button></div>
     </details>`;
  else if (k === 'custom') box.innerHTML = `
     <label>标题</label><input id="p_ctitle" value="${st.custom.title}">
     <label>内容（每行一条）</label><textarea id="p_clines">${st.custom.lines.join('\n')}</textarea>`;
  else if (k === 'photo') box.innerHTML = `<label>轮播方式</label><select id="p_mode"><option value="shuffle">洗牌不重复</option><option value="random">纯随机</option></select><div class="hint" style="margin-top:6px">在下方照片库添加照片</div>`;
  else box.innerHTML = `<div class="hint">这个模板不需要额外设置</div>`;

  const bind = (id, fn) => { const el = $(id); if (el) el.onchange = () => { fn(el.value); save(); draw(); }; };
  bind('p_quote', (v) => st.quote = v);
  bind('p_todos', (v) => st.todos = v.split('\n').map(s => s.trim()).filter(Boolean));
  bind('p_cd', (v) => st.countdowns = v.split('\n').map(l => { const [name, date] = l.split(','); return name && date ? { name: name.trim(), date: date.trim() } : null; }).filter(Boolean));
  bind('p_city', (v) => st.city = v.trim());
  bind('p_title', (v) => st.poem.title = v);
  bind('p_dyn', (v) => st.poem.dynasty = v);
  bind('p_author', (v) => st.poem.author = v);
  bind('p_lines', (v) => st.poem.lines = v.split('\n').map(s => s.trim()).filter(Boolean));
  bind('p_note', (v) => st.poemNote = v);
  bind('p_ctitle', (v) => st.custom.title = v);
  bind('p_clines', (v) => st.custom.lines = v.split('\n').map(s => s.trim()).filter(Boolean));
  const pf = $('p_full');
  if (pf) { pf.value = st.poemFull ? '1' : '0'; pf.onchange = () => { st.poemFull = pf.value === '1'; save(); draw(); }; }
  const m = $('p_mode'); if (m) { m.value = st.photoMode; m.onchange = () => { st.photoMode = m.value; save(); }; }
}

// ── 天气 ──
async function fetchWeather() {
  try {
    const geo = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(st.city)}&count=1&language=zh`)).json();
    const g = geo.results?.[0];
    if (!g) throw new Error('找不到这个城市');
    st.lat = g.latitude; st.lon = g.longitude;
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${st.lat}&longitude=${st.lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weather_code&forecast_days=1&timezone=auto`)).json();
    const code = w.current.weather_code;
    st.weather = { temp: w.current.temperature_2m, hi: w.daily.temperature_2m_max[0], lo: w.daily.temperature_2m_min[0],
      feels: w.current.apparent_temperature ?? w.current.temperature_2m, code,
      text: wxText(code), city: g.name };
    st.hourly = w.hourly.time.slice(0, 4).map((t, i) => ({ t: t.slice(11, 16), temp: Math.round(w.hourly.temperature_2m[i]), text: wxText(w.hourly.weather_code[i]) }));
    save(); renderParams(); draw(); log(`天气已更新：${st.weather.temp}° ${st.weather.text}`);
  } catch (e) { log('❌ 天气获取失败：' + e.message); }
}
function wxText(c) { return c === 0 ? '晴' : c < 4 ? '多云' : c < 50 ? '雾' : c < 70 ? '雨' : c < 80 ? '雪' : '雨'; }

// ── 绘制 ──
function draw() {
  const now = new Date();
  const view = { now, quote: st.quote, todos: st.todos, countdowns: st.countdowns, weather: st.weather,
    hourly: st.hourly, poem: st.poem, poemNote: st.poemNote, custom: st.custom,
    poemFull: st.poemFull };
  if (st.template === 'photo') {
    const p = pickPhoto();
    if (!p) {
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#000'; ctx.font = '20px "PingFang SC",sans-serif';
      ctx.fillText('照片库是空的，先添加照片', 40, 84);
      photoReady = Promise.resolve();
      return;
    }
    const img = new Image();
    photoReady = new Promise((res) => {
      img.onload = () => {
        const s = Math.max(W / img.width, H / img.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
        ctx.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s);
        res();
      };
      img.onerror = () => res();
    });
    img.src = p.data;
    return;
  }
  if (st.template === 'weather') return T.drawWeather(ctx, view);
  if (st.template === 'weather2') return T.drawWeather2(ctx, view);
  if (st.template === 'poem') return T.drawPoem(ctx, view);
  if (st.template === 'custom') return T.drawCustom(ctx, view);
  if (st.template === 'summary') return T.drawSummary(ctx, view);
  if (st.template === 'todo') return T.drawTodo(ctx, view);
  if (st.template === 'progress') return T.drawProgress(ctx, view);
  if (st.template === 'calendar') return T.drawCalendar(ctx, view);
  if (st.template === 'countdown') return T.drawCountdown(ctx, view);
  return T.drawQuote(ctx, view);
}

// ── 发送 ──
let device = null;
let photoReady = Promise.resolve();   // 预览那张图加载完成的信号，发送前等它
async function build() {
  const t0 = performance.now();
  const arts = buildPayloads(ctx.getImageData(0, 0, W, H));
  log(`已生成 payload ${arts.payload.length} B（${(performance.now() - t0).toFixed(0)} ms）`);
  return arts;
}
async function forceScan() {
  if (!('bluetooth' in navigator)) return log('浏览器不支持 Web Bluetooth（iOS 全部不支持，请用安卓 Chrome）');
  try {
    log('列出全部蓝牙设备…（安卓需要在系统里允许「附近的设备/位置」权限）');
    const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [0xfef0, 0xfdf0] });
    log('（若列表里都是「未知设备」，说明系统没扫到卡片：先确认桌面服务已暂停、卡片已唤醒）');
    device = d;
    log('已选择：' + (d.name || d.id) + '，现在点「连接并发送」');
  } catch (e) { log('❌ ' + (e?.message || e)); }
}

async function sendNow() {
  const btn = $('send');
  if (!bleSupported()) { btn.disabled = false; return log('❌ 浏览器不支持 Web Bluetooth'); }
  $('send').disabled = true;
  try {
    // 不要在发送前重画：那会重新抽一张照片，和预览不一致
    if (st.template === 'photo') await photoReady;
    const arts = await build();
    const res = await sendToCard(arts.payload, log, (p) => $('prog').style.width = (p * 100) + '%', device);
    device = res.device || device;   // 记住设备，定时任务复用（否则每次都要人点）
    $('state').textContent = res.acked ? '✅ 已确认' : '✅ 已写完（未确认）';
    $('state').className = 'hint';
  } catch (e) {
    const m = String(e?.message || e);
    log('❌ ' + m);
    if (m.includes('disconnected') || m.includes('GATT')) log('提示：设备已断开，再点一次会重新连接');
  } finally {
    btn.disabled = false;
  }
}
function rebuild() { draw(); build(); }

// ── 定时 ──
let timer = null;
function renderSched() {
  $('schedList').innerHTML = (st.sched || []).map((s, i) => `
    <div class="sched">
      <input type="time" value="${s.time}" data-i="${i}" data-f="time">
      <select data-i="${i}" data-f="template">${TPLS.map(([k, n]) => `<option value="${k}" ${s.template === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <button class="ghost" onclick="runSched(${i})">执行</button>
      <button class="ghost" onclick="delSched(${i})">删</button>
    </div>`).join('');
  $('schedList').querySelectorAll('[data-f]').forEach((el) => {
    el.onchange = () => {
      const item = st.sched[el.dataset.i];
      item[el.dataset.f] = el.value;
      delete item.lastRun;      // 改了时间/模板就要重新算，否则今天永远不会再触发
      save();
    };
  });
}
function addSched() { (st.sched = st.sched || []).push({ time: '08:00', template: 'summary' }); save(); renderSched(); }
function delSched(i) { st.sched.splice(i, 1); save(); renderSched(); }
async function runSched(i) { st.template = st.sched[i].template; renderTabs(); renderParams(); draw(); await new Promise(r => setTimeout(r, 200)); sendNow(); }
function startSched() {
  if (timer) { clearInterval(timer); timer = null; $('schedBtn').textContent = '启用定时'; $('schedState').textContent = '已停止'; return; }
  timer = setInterval(checkSched, 20000);
  $('schedBtn').textContent = '停止定时';
  $('schedState').textContent = '运行中（页面需保持打开）';
  checkSched();
}
async function acquireDevice() {
  // 刷新页面后 device 会丢，但浏览器仍记得授权过；getDevices 能免弹窗取回
  try {
    const bt = navigator.bluetooth;
    if (!bt || !bt.getDevices) return;
    const list = await bt.getDevices();
    if (list?.length) { device = list[0]; log('已恢复上次授权的设备：' + (device.name || device.id)); }
  } catch (e) { /* 忽略 */ }
}

let sendingSched = false;
function checkSched() {
  const now = new Date();
  const today = now.toDateString();
  const minutesNow = now.getHours() * 60 + now.getMinutes();
  (st.sched || []).forEach((s) => {
    if (!s || !s.time) return;
    if (s.lastRun === today) { return; }
    const [hh, mm] = s.time.split(':').map(Number);
    const due = hh * 60 + mm;
    // 允许 5 分钟补跑：后台标签页的定时器会被浏览器降频，逐分钟精确匹配会漏掉
    if (minutesNow < due || minutesNow - due > 5) return;
    s.lastRun = today; save();
    log(`⏰ 到点：${s.time} → ${s.template}`);
    if (!device) { log('还没授权过卡片：先手动点一次「连接并发送」，之后定时就能自动发'); return; }
    if (sendingSched) { log('上一个定时任务还在发送，跳过这次'); return; }
    sendingSched = true;
    st.template = s.template; renderTabs(); renderParams(); draw();
    setTimeout(() => { sendNow().finally(() => { sendingSched = false; }); }, 400);
  });
}

// ── 事件 ──
$('files').addEventListener('change', (e) => { addPhotos(e.target.files); e.target.value = ''; });
$('dir').addEventListener('change', (e) => { addPhotos(e.target.files); e.target.value = ''; });
const drop = $('drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.style.borderColor = 'var(--line)'; }));
drop.addEventListener('drop', async (e) => {
  const items = [...(e.dataTransfer?.items || [])];
  const out = [];
  for (const it of items) {
    if (it.kind !== 'file') continue;
    const entry = it.webkitGetAsEntry?.();
    if (entry?.isDirectory) {
      await new Promise((done) => {
        const reader = entry.createReader();
        const read = () => reader.readEntries((ents) => {
          if (!ents.length) return done();
          ents.forEach((en) => { if (en.isFile) en.file((f) => f.type.startsWith('image/') && out.push(f)); });
          read();
        });
        read();
      });
    } else {
      const f = it.getAsFile();
      if (f && f.type.startsWith('image/')) out.push(f);
    }
  }
  log(`拖入 ${out.length} 个文件`);
  addPhotos(out);
});
async function genNote() {
  const endpoint = ($('p_api').value || '').trim().replace(/\/$/, '');
  const key = ($('p_key').value || '').trim();
  const model = ($('p_model').value || 'deepseek-chat').trim();
  if (!endpoint || !key) return log('先填接口和 Key');
  st.aiEndpoint = endpoint; st.aiKey = key; st.aiModel = model; save();
  log('正在生成赏析…');
  try {
    const r = await fetch(endpoint + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({
        model,
        temperature: 0.3,
        max_tokens: 220,
        messages: [
          { role: 'system', content: '你是一名中学语文教材的诗词注释编写者。语言平实准确，按「写的什么景→用什么手法→表达什么情感」三层说明，70~110字，不抒情、不分点、不用引号。' },
          { role: 'user', content: `《${st.poem.title}》${st.poem.dynasty}${st.poem.author}\n原文：${st.poem.lines.join('／')}` },
        ],
      }),
    });
    const j = await r.json();
    const note = (j.choices?.[0]?.message?.content || '').trim();
    if (!note) throw new Error(j.error?.message || '返回为空');
    st.poemNote = note; save();
    $('p_note').value = note; draw();
    log('赏析已生成（' + note.length + ' 字）');
  } catch (e) { log('❌ 生成失败：' + (e?.message || e)); }
}
window.genNote = genNote;
window.forceScan = forceScan; window.fetchWeather = fetchWeather; window.rebuild = rebuild; window.sendNow = sendNow;
window.addSched = addSched; window.delSched = delSched; window.runSched = runSched; window.startSched = startSched;

renderTabs(); renderParams(); renderSched(); draw();

// 字号/行距滑杆：基准 1.1，与桌面版一致
const scaleSlide = document.getElementById('scaleSlide');
const lineSlide = document.getElementById('lineSlide');
function applyLayout() {
  const fs = (+scaleSlide.value) / 100;
  const ls = (+lineSlide.value) / 100;
  st.scale = fs; st.line = ls; save();
  document.getElementById('scaleText').textContent = scaleSlide.value + '%';
  document.getElementById('lineText').textContent = lineSlide.value + '%';
  T.setLayout(1.1 * fs, 1.1 * ls);
  draw();
}
scaleSlide.value = Math.round((st.scale || 1) * 100);
lineSlide.value = Math.round((st.line || 1) * 100);
scaleSlide.addEventListener('input', applyLayout);
lineSlide.addEventListener('input', applyLayout);
T.setLayout(1.1 * (st.scale || 1), 1.1 * (st.line || 1));
acquireDevice();
loadPhotos().catch((e) => log('照片库不可用：' + (e?.message || e)));
if (!st.weather && (st.template === 'weather' || st.template === 'summary')) fetchWeather();
draw();
</script>
